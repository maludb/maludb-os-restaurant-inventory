# Restaurant Inventory — an application from us beside the Business OS kernel (mcp-and-api.md §7). Rendered by the kernel's
# installer (bin/app_install.php): {{DOMAIN}} = the business's domain ({{APP_FQDN}} = kitchen.<domain>, the vhost label — D1),
# {{APP_DIR}} = /srv/apps/restaurant_inventory, {{APP_KEY}} = restaurant_inventory, the ports from config/.env
# ({{APP_INTERNAL_PORT}}, {{MCP_RECORDS_PORT}}, {{MCP_ACTIVITY_PORT}}). Two virtual hosts: the public name for people, the
# supplier's door and the two proxied MCP servers; and a loopback port for the kernel's actions server and approval replays.
#
# THE PUBLIC ALLOW-LIST (design §14), exactly: /s/ (the supplier's purchase-order link), /api/v1/health, /mcp/records,
# /mcp/activity. Everything else under /api answers 404. The Header lines are guarded: this host may have mod_headers off
# (Sales CRM's lesson; ROOT_STEPS 0b enables it).

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	ServerAlias kitchen.{{DOMAIN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/{{APP_KEY}}-error.log
	CustomLog ${APACHE_LOG_DIR}/{{APP_KEY}}-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
	LimitRequestBody 67108864
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
	</IfModule>

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# The two read MCP servers (Phase 4), under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard
	# checks it against loopback). Bearer auth is the servers' own (a person's token, the tenant's run token, or the kernel's).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# Under /api: the health check, nothing else (no feed of our own in v1 — design §8).
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/v1/health\.php$ - [L]
	RewriteRule ^/api/ - [R=404,L]
	# A records-server bridge, if one is built, is the internal port's door — never on this name.
	RewriteRule ^/internal/ - [R=404,L]

	# The supplier's door (design §4) — no session; the hashed token is the authority; rate-limited; logged as portal:
	#   /s/<48 hex>               the supplier's purchase-order page; its three actions POST to /s/<token>/<do>   (slice 4)
	RewriteRule ^/s/([a-f0-9]{48})/?$ /s.php?token=$1 [L,QSA]
	RewriteRule ^/s/([a-f0-9]{48})/([a-z_]+)$ /s.php?token=$1&do=$2 [L,QSA]

	# The gated attachment door (a session, and the record's visibility).
	RewriteRule ^/files/([0-9]+)$ /files.php?id=$1 [L,QSA]
	RewriteRule ^/files/([0-9]+)/thumb$ /files.php?id=$1&thumb=1 [L,QSA]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# A report by name (the manifest's /reports/{report}): report.php reads ?report=.
	RewriteCond %{DOCUMENT_ROOT}/reports/$1.php !-f
	RewriteRule ^/reports/([a-z-]+)/?$ /reports/report.php?report=$1 [L,QSA]

	# Screens outside the canonical shape (the manifest, Phase 1): a page of a record (/recipes/12/cost, /counts/3/review).
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/new → form.php, /x/{id}/edit → form.php?id=, /x/{id} → view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/{{APP_KEY}}-error.log
	CustomLog ${APACHE_LOG_DIR}/{{APP_KEY}}-access.log combined
	LimitRequestBody 67108864
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
	</IfModule>
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/files/([0-9]+)$ /files.php?id=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/reports/$1.php !-f
	RewriteRule ^/reports/([a-z-]+)/?$ /reports/report.php?report=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
